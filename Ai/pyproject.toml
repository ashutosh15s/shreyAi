[project]
name = "shrey-ai"
version = "0.1.0"
description = "Shrey AI Service - FastAPI, Groq, Gemini STT/TTS, OpenRouter, LangGraph, ChromaDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "pymongo>=4.8.0",
    "psutil>=6.0.0",
    "pyautogui>=0.9.54",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "chromadb>=0.5.0",
    "tavily-python>=0.3.0",
]
