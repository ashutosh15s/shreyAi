spring.application.name=shrey-ai-backend
server.port=${PORT:8080}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/shreyai}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.secret=${JWT_SECRET:shrey_ai_super_secret_jwt_key_that_is_at_least_256_bits_long_for_hmac_sha256!}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Rate Limiting per minute per provider
rate-limit.groq.capacity=${RATE_LIMIT_GROQ:60}
rate-limit.grok.capacity=${RATE_LIMIT_GROK:20}
rate-limit.gemini.capacity=${RATE_LIMIT_GEMINI:100}
rate-limit.openrouter.capacity=${RATE_LIMIT_OPENROUTER:100}
rate-limit.default.capacity=${RATE_LIMIT_DEFAULT:60}

# AI Service URL (FastAPI target for proxy gateway)
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
